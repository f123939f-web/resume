<!-- ========================================================
     徐益晟 AI 數位履歷分身 (AI Chatbot Widget)
     純前端 HTML + CSS + JS 獨立輕量實作
     ======================================================== -->
<div id="ai-resume-widget">
  <!-- 懸浮啟動按鈕 (FAB) -->
  <div id="ai-fab-container">
    <div id="ai-fab-tooltip" class="ai-fab-tooltip">
      <span class="ai-tooltip-pulse"></span>
      <span>👋 點擊與 <strong>徐益晟的 AI 分身</strong> 即時對話！</span>
      <button id="ai-tooltip-close" aria-label="關閉提示">&times;</button>
    </div>
    <button id="ai-fab-button" class="ai-fab-button" aria-label="開啟 AI 履歷對話">
      <div class="ai-glow-ring"></div>
      <div class="ai-glow-ring secondary"></div>
      <div class="ai-fab-inner">
        <!-- 科技感機器人向量圖示 -->
        <svg class="ai-bot-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="11" width="18" height="10" rx="3"></rect>
          <circle cx="12" cy="5" r="2"></circle>
          <path d="M12 7v4"></path>
          <line x1="8" y1="16" x2="8.01" y2="16" stroke-width="3"></line>
          <line x1="16" y1="16" x2="16.01" y2="16" stroke-width="3"></line>
        </svg>
        <span class="ai-online-status" title="分身在線中"></span>
      </div>
    </button>
  </div>

  <!-- 聊天彈出主視窗 -->
  <div id="ai-chat-window" class="ai-chat-window" aria-hidden="true">
    <!-- 視窗頂部 Header -->
    <div class="ai-chat-header">
      <div class="ai-header-left">
        <div class="ai-avatar-pulse-wrap">
          <div class="ai-avatar-circle">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M12 2a2 2 0 0 1 2 2v2a2 2 0 0 1-4 0V4a2 2 0 0 1 2-2z"></path>
              <rect x="4" y="6" width="16" height="12" rx="4"></rect>
              <circle cx="9" cy="12" r="1.5" fill="currentColor"></circle>
              <circle cx="15" cy="12" r="1.5" fill="currentColor"></circle>
              <path d="M9 15c1 .8 2 1 3 1s2-.2 3-1"></path>
            </svg>
          </div>
          <span class="ai-pulse-dot"></span>
        </div>
        <div class="ai-header-info">
          <div class="ai-header-title">徐益晟 的 AI 數位分身 <span class="ai-badge-tech">AGENT</span></div>
          <div class="ai-header-sub">
            <span class="ai-status-indicator"></span>企管專業 &amp; 產業專案導覽分身
          </div>
        </div>
      </div>
      <div class="ai-header-actions">
        <button id="ai-btn-sound" class="ai-icon-btn" title="切換音效" aria-label="切換音效">
          <svg id="ai-sound-icon" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2">
            <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
            <path d="M15.54 8.46a5 5 0 0 1 0 7.07"></path>
          </svg>
        </button>
        <button id="ai-btn-reset" class="ai-icon-btn" title="重新對話" aria-label="重新對話">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2">
            <polyline points="1 4 1 10 7 10"></polyline>
            <path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"></path>
          </svg>
        </button>
        <button id="ai-btn-close" class="ai-icon-btn" title="縮小視窗" aria-label="縮小視窗">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="18" y1="6" x2="6" y2="18"></line>
            <line x1="6" y1="6" x2="18" y2="18"></line>
          </svg>
        </button>
      </div>
    </div>

    <!-- 4 個一鍵點選膠囊標籤 (Pill Tags) -->
    <div class="ai-quick-pills-bar">
      <div class="ai-pills-title">✨ 快速提問探索：</div>
      <div class="ai-pills-scroll">
        <button class="ai-pill-btn" data-topic="intro">
          <span class="ai-pill-icon">🙋‍♂️</span>請自我介紹
        </button>
        <button class="ai-pill-btn highlight" data-topic="project">
          <span class="ai-pill-icon">📊</span>介紹你的產業分析專案
        </button>
        <button class="ai-pill-btn" data-topic="skills">
          <span class="ai-pill-icon">💼</span>你的企管核心專長
        </button>
        <button class="ai-pill-btn" data-topic="contact">
          <span class="ai-pill-icon">📬</span>如何連絡你
        </button>
      </div>
    </div>

    <!-- 訊息對話區 -->
    <div id="ai-messages-container" class="ai-messages-container">
      <!-- 訊息由 JS 動態注入 -->
    </div>

    <!-- 底部輸入區 -->
    <div class="ai-chat-footer">
      <form id="ai-chat-form" class="ai-chat-input-form" onsubmit="return false;">
        <input 
          type="text" 
          id="ai-user-input" 
          class="ai-input-field" 
          placeholder="輸入訊息或詢問專案、專長..." 
          autocomplete="off" 
          maxlength="200"
        />
        <button type="submit" id="ai-send-btn" class="ai-send-button" aria-label="發送訊息">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="22" y1="2" x2="11" y2="13"></line>
            <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
          </svg>
        </button>
      </form>
      <div class="ai-footer-note">徐益晟 AI 數位履歷分身 · Powered by 純前端 Agent 核心</div>
    </div>
  </div>
</div>

<style>
  /* =========================================================
     AI Chatbot Widget 科技感與現代美學樣式 (純 CSS)
     ========================================================= */
  #ai-resume-widget {
    font-family: 'Plus Jakarta Sans', 'Noto Sans TC', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    position: fixed;
    bottom: 24px;
    right: 24px;
    z-index: 999999;
    --ai-primary: #2563EB;
    --ai-primary-glow: rgba(37, 99, 235, 0.45);
    --ai-cyan: #06B6D4;
    --ai-cyan-glow: rgba(6, 182, 212, 0.45);
    --ai-emerald: #10B981;
    --ai-dark: #0F172A;
    --ai-card-bg: rgba(255, 255, 255, 0.96);
    --ai-border: rgba(226, 232, 240, 0.9);
    --ai-bot-msg-bg: #F8FAFC;
    --ai-user-msg-bg: linear-gradient(135deg, #2563EB, #1D4ED8);
  }

  /* 懸浮按鈕容器 */
  #ai-fab-container {
    position: relative;
    display: flex;
    align-items: center;
    justify-content: flex-end;
  }

  /* 提示氣泡 (Tooltip) */
  .ai-fab-tooltip {
    position: absolute;
    right: 76px;
    bottom: 6px;
    background: #0F172A;
    color: #F8FAFC;
    padding: 10px 16px;
    border-radius: 999px;
    font-size: 0.86rem;
    font-weight: 500;
    white-space: nowrap;
    box-shadow: 0 10px 25px -5px rgba(15, 23, 42, 0.35), 0 0 0 1px rgba(255, 255, 255, 0.1);
    display: flex;
    align-items: center;
    gap: 8px;
    opacity: 0;
    transform: translateX(12px) scale(0.95);
    pointer-events: none;
    transition: all 0.35s cubic-bezier(0.16, 1, 0.3, 1);
  }

  .ai-fab-tooltip.show {
    opacity: 1;
    transform: translateX(0) scale(1);
    pointer-events: auto;
  }

  .ai-fab-tooltip strong {
    color: #38BDF8;
  }

  .ai-tooltip-pulse {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: #10B981;
    box-shadow: 0 0 8px #10B981;
    animation: aiPulseDot 1.5s infinite;
  }

  #ai-tooltip-close {
    background: none;
    border: none;
    color: #94A3B8;
    font-size: 1.1rem;
    cursor: pointer;
    line-height: 1;
    padding: 0 2px 0 6px;
    transition: color 0.2s;
  }
  #ai-tooltip-close:hover {
    color: #FFFFFF;
  }

  /* 懸浮主按鈕 (FAB) */
  .ai-fab-button {
    position: relative;
    width: 64px;
    height: 64px;
    border-radius: 50%;
    border: none;
    outline: none;
    background: linear-gradient(135deg, #1E293B, #0F172A);
    color: #FFFFFF;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 8px 24px rgba(37, 99, 235, 0.35), 0 2px 6px rgba(0, 0, 0, 0.2);
    transition: transform 0.25s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.25s;
  }

  .ai-fab-button:hover {
    transform: scale(1.08) translateY(-2px);
    box-shadow: 0 12px 32px rgba(37, 99, 235, 0.5), 0 4px 10px rgba(0, 0, 0, 0.3);
  }

  .ai-fab-button:active {
    transform: scale(0.95);
  }

  /* 呼吸光環動畫 (Breathing Light Animation) */
  .ai-glow-ring {
    position: absolute;
    inset: -4px;
    border-radius: 50%;
    background: linear-gradient(45deg, #2563EB, #06B6D4, #10B981, #2563EB);
    background-size: 300% 300%;
    z-index: -1;
    animation: aiRotateGradient 4s linear infinite, aiBreathingGlow 2.5s ease-in-out infinite;
    opacity: 0.85;
  }

  .ai-glow-ring.secondary {
    inset: -8px;
    opacity: 0.35;
    filter: blur(8px);
    animation: aiRotateGradient 6s linear infinite reverse, aiBreathingGlow 2.5s ease-in-out infinite 0.5s;
  }

  @keyframes aiRotateGradient {
    0% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
  }

  @keyframes aiBreathingGlow {
    0%, 100% {
      transform: scale(1);
      opacity: 0.65;
    }
    50% {
      transform: scale(1.12);
      opacity: 1;
      filter: blur(4px);
    }
  }

  @keyframes aiPulseDot {
    0% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.7); }
    70% { box-shadow: 0 0 0 6px rgba(16, 185, 129, 0); }
    100% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0); }
  }

  .ai-fab-inner {
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .ai-bot-icon {
    width: 32px;
    height: 32px;
    stroke: #38BDF8;
    filter: drop-shadow(0 0 6px rgba(56, 189, 248, 0.6));
    transition: transform 0.3s ease;
  }

  .ai-fab-button:hover .ai-bot-icon {
    transform: rotate(10deg) scale(1.1);
  }

  .ai-online-status {
    position: absolute;
    bottom: -2px;
    right: -2px;
    width: 10px;
    height: 10px;
    background: #10B981;
    border: 2px solid #0F172A;
    border-radius: 50%;
  }

  /* 聊天彈出主視窗 (Chat Window) */
  .ai-chat-window {
    position: absolute;
    bottom: 80px;
    right: 0;
    width: 410px;
    height: 620px;
    max-height: calc(100vh - 120px);
    background: var(--ai-card-bg);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border: 1px solid var(--ai-border);
    border-radius: 20px;
    box-shadow: 0 25px 60px -15px rgba(15, 23, 42, 0.3), 0 0 0 1px rgba(255, 255, 255, 0.8) inset;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    opacity: 0;
    transform: translateY(24px) scale(0.92);
    pointer-events: none;
    transition: all 0.35s cubic-bezier(0.16, 1, 0.3, 1);
    transform-origin: bottom right;
  }

  .ai-chat-window.open {
    opacity: 1;
    transform: translateY(0) scale(1);
    pointer-events: auto;
  }

  /* 視窗頂部 Header */
  .ai-chat-header {
    background: linear-gradient(135deg, #0F172A, #1E293B);
    color: #FFFFFF;
    padding: 16px 18px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    position: relative;
    overflow: hidden;
  }

  .ai-chat-header::before {
    content: "";
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    height: 3px;
    background: linear-gradient(90deg, #2563EB, #06B6D4, #10B981);
  }

  .ai-header-left {
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .ai-avatar-pulse-wrap {
    position: relative;
  }

  .ai-avatar-circle {
    width: 40px;
    height: 40px;
    border-radius: 50%;
    background: linear-gradient(135deg, #2563EB, #06B6D4);
    display: flex;
    align-items: center;
    justify-content: center;
    color: #FFFFFF;
    box-shadow: 0 0 12px rgba(6, 182, 212, 0.4);
  }

  .ai-avatar-circle svg {
    width: 22px;
    height: 22px;
  }

  .ai-pulse-dot {
    position: absolute;
    bottom: -1px;
    right: -1px;
    width: 9px;
    height: 9px;
    background: #10B981;
    border: 2px solid #0F172A;
    border-radius: 50%;
    box-shadow: 0 0 6px #10B981;
  }

  .ai-header-title {
    font-size: 0.95rem;
    font-weight: 700;
    color: #FFFFFF;
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .ai-badge-tech {
    font-size: 0.65rem;
    padding: 2px 6px;
    border-radius: 4px;
    background: rgba(56, 189, 248, 0.2);
    color: #38BDF8;
    border: 1px solid rgba(56, 189, 248, 0.4);
    letter-spacing: 0.5px;
    font-weight: 700;
  }

  .ai-header-sub {
    font-size: 0.75rem;
    color: #94A3B8;
    display: flex;
    align-items: center;
    gap: 6px;
    margin-top: 2px;
  }

  .ai-status-indicator {
    width: 6px;
    height: 6px;
    background: #10B981;
    border-radius: 50%;
    display: inline-block;
  }

  .ai-header-actions {
    display: flex;
    align-items: center;
    gap: 4px;
  }

  .ai-icon-btn {
    background: transparent;
    border: none;
    color: #94A3B8;
    width: 32px;
    height: 32px;
    border-radius: 8px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background 0.2s, color 0.2s;
  }

  .ai-icon-btn:hover {
    background: rgba(255, 255, 255, 0.12);
    color: #FFFFFF;
  }

  .ai-icon-btn.active {
    color: #38BDF8;
  }

  /* 4 個一鍵點選膠囊標籤 */
  .ai-quick-pills-bar {
    background: #F8FAFC;
    border-bottom: 1px solid var(--ai-border);
    padding: 10px 14px 12px;
  }

  .ai-pills-title {
    font-size: 0.72rem;
    font-weight: 700;
    color: #64748B;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    margin-bottom: 8px;
  }

  .ai-pills-scroll {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
  }

  .ai-pill-btn {
    background: #FFFFFF;
    border: 1px solid #CBD5E1;
    color: #1E293B;
    padding: 6px 11px;
    border-radius: 999px;
    font-size: 0.78rem;
    font-weight: 600;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: 5px;
    transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
    box-shadow: 0 1px 2px rgba(0, 0, 0, 0.04);
  }

  .ai-pill-btn:hover {
    background: #EFF6FF;
    border-color: #3B82F6;
    color: #1D4ED8;
    transform: translateY(-1px);
    box-shadow: 0 3px 8px rgba(37, 99, 235, 0.15);
  }

  .ai-pill-btn.highlight {
    background: #F0FDF4;
    border-color: #86EFAC;
    color: #15803D;
  }
  .ai-pill-btn.highlight:hover {
    background: #DCFCE7;
    border-color: #22C55E;
    color: #166534;
  }

  .ai-pill-icon {
    font-size: 0.85rem;
  }

  /* 對話訊息區 */
  .ai-messages-container {
    flex: 1;
    overflow-y: auto;
    padding: 18px 16px;
    display: flex;
    flex-direction: column;
    gap: 16px;
    background: #F8FAFC;
    scroll-behavior: smooth;
  }

  /* 自訂滾動條 */
  .ai-messages-container::-webkit-scrollbar {
    width: 5px;
  }
  .ai-messages-container::-webkit-scrollbar-thumb {
    background: #CBD5E1;
    border-radius: 999px;
  }

  /* 訊息對齊與外觀 */
  .ai-msg-row {
    display: flex;
    gap: 10px;
    align-items: flex-start;
    animation: aiFadeSlideUp 0.3s cubic-bezier(0.16, 1, 0.3, 1);
  }

  @keyframes aiFadeSlideUp {
    from {
      opacity: 0;
      transform: translateY(8px);
    }
    to {
      opacity: 1;
      transform: translateY(0);
    }
  }

  .ai-msg-row.user {
    justify-content: flex-end;
  }

  .ai-msg-avatar {
    width: 30px;
    height: 30px;
    border-radius: 50%;
    background: linear-gradient(135deg, #2563EB, #06B6D4);
    display: flex;
    align-items: center;
    justify-content: center;
    color: #FFF;
    flex-shrink: 0;
    box-shadow: 0 2px 6px rgba(37, 99, 235, 0.2);
  }

  .ai-msg-avatar svg {
    width: 16px;
    height: 16px;
  }

  .ai-msg-bubble {
    max-width: 84%;
    padding: 12px 16px;
    border-radius: 14px;
    font-size: 0.9rem;
    line-height: 1.6;
    color: #1E293B;
    background: #FFFFFF;
    border: 1px solid #E2E8F0;
    box-shadow: 0 2px 6px rgba(0, 0, 0, 0.04);
    position: relative;
    word-break: break-word;
  }

  .ai-msg-row.bot .ai-msg-bubble {
    border-top-left-radius: 4px;
  }

  .ai-msg-row.user .ai-msg-bubble {
    background: var(--ai-user-msg-bg);
    color: #FFFFFF;
    border: none;
    border-top-right-radius: 4px;
    box-shadow: 0 4px 12px rgba(37, 99, 235, 0.25);
  }

  /* 訊息內部排版樣式 */
  .ai-msg-bubble p {
    margin-bottom: 8px;
  }
  .ai-msg-bubble p:last-child {
    margin-bottom: 0;
  }

  .ai-msg-bubble ul {
    margin: 6px 0 10px 18px;
    padding: 0;
  }

  .ai-msg-bubble li {
    margin-bottom: 4px;
  }

  /* 專案焦點亮點卡片 */
  .ai-project-highlight-box {
    background: linear-gradient(135deg, #EFF6FF 0%, #F0FDF4 100%);
    border: 1px solid #BFDBFE;
    border-radius: 10px;
    padding: 12px 14px;
    margin: 10px 0;
    font-size: 0.85rem;
  }

  .ai-highlight-title {
    font-weight: 700;
    color: #1E40AF;
    margin-bottom: 6px;
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .ai-metric-tags {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    margin-top: 8px;
  }

  .ai-metric-tag {
    background: #FFFFFF;
    border: 1px solid #93C5FD;
    color: #1E3A8A;
    padding: 2px 8px;
    border-radius: 6px;
    font-size: 0.75rem;
    font-weight: 600;
  }

  /* 專案導覽連動按鈕 (Project Link Button) */
  .ai-jump-btn {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    background: linear-gradient(135deg, #2563EB, #1D4ED8);
    color: #FFFFFF !important;
    font-size: 0.86rem;
    font-weight: 600;
    text-decoration: none;
    padding: 10px 16px;
    border-radius: 8px;
    margin-top: 10px;
    box-shadow: 0 4px 12px rgba(37, 99, 235, 0.3);
    transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
    cursor: pointer;
    border: none;
  }

  .ai-jump-btn:hover {
    background: linear-gradient(135deg, #1D4ED8, #1E40AF);
    transform: translateY(-2px);
    box-shadow: 0 6px 18px rgba(37, 99, 235, 0.45);
  }

  .ai-jump-btn svg {
    transition: transform 0.2s ease;
  }

  .ai-jump-btn:hover svg {
    transform: translateX(4px);
  }

  .ai-jump-btn.emerald {
    background: linear-gradient(135deg, #10B981, #059669);
    box-shadow: 0 4px 12px rgba(16, 185, 129, 0.3);
  }
  .ai-jump-btn.emerald:hover {
    background: linear-gradient(135deg, #059669, #047857);
    box-shadow: 0 6px 18px rgba(16, 185, 129, 0.45);
  }

  .ai-contact-grid {
    display: flex;
    flex-direction: column;
    gap: 8px;
    margin-top: 10px;
  }

  .ai-contact-item {
    background: #F1F5F9;
    border: 1px solid #E2E8F0;
    border-radius: 8px;
    padding: 8px 12px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    text-decoration: none;
    color: #1E293B;

      if (!AudioContext) return;
      const ctx = new AudioContext();
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.connect(gain);
      gain.connect(ctx.destination);

      if (type === 'open') {
        osc.frequency.setValueAtTime(440, ctx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(880, ctx.currentTime + 0.15);
        gain.gain.setValueAtTime(0.08, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.15);
        osc.start();
        osc.stop(ctx.currentTime + 0.16);
      } else if (type === 'send') {
        osc.frequency.setValueAtTime(520, ctx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(780, ctx.currentTime + 0.1);
        gain.gain.setValueAtTime(0.06, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.1);
        osc.start();
        osc.stop(ctx.currentTime + 0.11);
      } else if (type === 'receive') {
        osc.frequency.setValueAtTime(660, ctx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(990, ctx.currentTime + 0.14);
        gain.gain.setValueAtTime(0.07, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.14);

  });

  // 4 大膠囊標籤點擊事件
  pillBtns.forEach(btn => {
    btn.addEventListener('click', () => {
      const topic = btn.getAttribute('data-topic');
      if (KNOWLEDGE_BASE[topic]) {
        // 先輸出使用者點擊的問題標籤名稱
        const topicNames = {
          intro: '請自我介紹',
          project: '介紹你的產業分析專案',
          skills: '你的企管核心專長',
          contact: '如何連絡你'
        };
        appendMessage('user', topicNames[topic] || btn.innerText.trim(), false);
        playBeep('send');
        simulateAiResponse(KNOWLEDGE_BASE[topic].html);
      }
    });
  });

  // 送出表單事件
  chatForm.addEventListener('submit', (e) => {
    e.preventDefault();
    if (userInput.value.trim() && !isTyping) {
      handleUserQuery(userInput.value);
    }
  });

  // 頁面載入 1.8 秒後溫和浮現提示氣泡
  setTimeout(() => {
    if (!chatWindow.classList.contains('open')) {
      tooltip.classList.add('show');
    }
  }, 1800);

})();
</script>
